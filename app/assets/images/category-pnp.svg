<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="12" fill="#F8F5F0"/>
  <!-- Board -->
  <rect x="90" y="60" width="220" height="180" rx="8" fill="#E8DCC8" stroke="#C4B59A" stroke-width="2"/>
  <rect x="100" y="70" width="200" height="160" rx="4" fill="#F5EDDB" stroke="#D4C4A8" stroke-width="1"/>
  <!-- Grid lines on board -->
  <line x1="150" y1="70" x2="150" y2="230" stroke="#D4C4A8" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="200" y1="70" x2="200" y2="230" stroke="#D4C4A8" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="250" y1="70" x2="250" y2="230" stroke="#D4C4A8" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="100" y1="120" x2="300" y2="120" stroke="#D4C4A8" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="100" y1="170" x2="300" y2="170" stroke="#D4C4A8" stroke-width="0.5" stroke-dasharray="4 4"/>
  <!-- Cards stack -->
  <g transform="translate(40, 100)">
    <rect x="4" y="4" width="42" height="60" rx="3" fill="#E0D5C5" stroke="#B8A88A" stroke-width="1"/>
    <rect x="2" y="2" width="42" height="60" rx="3" fill="#EDE6D8" stroke="#B8A88A" stroke-width="1"/>
    <rect x="0" y="0" width="42" height="60" rx="3" fill="#F8F2E8" stroke="#C4B59A" stroke-width="1.5"/>
    <text x="21" y="35" text-anchor="middle" fill="#8B7355" font-size="18" font-weight="700" font-family="system-ui">A</text>
  </g>
  <!-- Cards right side -->
  <g transform="translate(318, 80)">
    <rect x="4" y="4" width="42" height="60" rx="3" fill="#D5E0D5" stroke="#8BAA8B" stroke-width="1"/>
    <rect x="2" y="2" width="42" height="60" rx="3" fill="#E0EDE0" stroke="#8BAA8B" stroke-width="1"/>
    <rect x="0" y="0" width="42" height="60" rx="3" fill="#EAF5EA" stroke="#A0C0A0" stroke-width="1.5"/>
    <text x="21" y="35" text-anchor="middle" fill="#557755" font-size="18" font-weight="700" font-family="system-ui">7</text>
  </g>
  <!-- 3D printed tokens on board -->
  <circle cx="140" cy="145" r="12" fill="#E07040" stroke="#C05030" stroke-width="1.5"/>
  <circle cx="200" cy="110" r="10" fill="#4090D0" stroke="#3070B0" stroke-width="1.5"/>
  <circle cx="250" cy="195" r="11" fill="#50A050" stroke="#408040" stroke-width="1.5"/>
  <!-- Meeple on board -->
  <path d="M185 185 L190 175 Q195 168 200 175 L205 185 L200 185 L200 200 L185 200 L185 185Z" fill="#D0A030" stroke="#B08020" stroke-width="1.5"/>
  <!-- Dice -->
  <g transform="translate(260, 100)">
    <rect x="0" y="0" width="22" height="22" rx="4" fill="#F0F0F0" stroke="#999" stroke-width="1.5"/>
    <circle cx="7" cy="7" r="2" fill="#333"/>
    <circle cx="15" cy="7" r="2" fill="#333"/>
    <circle cx="11" cy="11" r="2" fill="#333"/>
    <circle cx="7" cy="15" r="2" fill="#333"/>
    <circle cx="15" cy="15" r="2" fill="#333"/>
  </g>
  <!-- Premium badge -->
  <g transform="translate(135, 245)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#2A9D8F" opacity="0.9"/>
    <text x="65" y="18" text-anchor="middle" fill="white" font-size="11" font-weight="700" font-family="system-ui" letter-spacing="1.5">PREMIUM PnP</text>
  </g>
</svg>
